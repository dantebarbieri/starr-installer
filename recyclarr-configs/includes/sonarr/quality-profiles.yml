# Source preference is internal: requesters still choose a resolution.
# Anime groups Blu-ray encodes with remuxes so release-tier scores decide.
quality_profiles:
  - name: SD - 480p
    reset_unmatched_scores: &reset_scores
      enabled: true
    upgrade:
      allowed: true
      until_quality: Bluray-480p
      until_score: 10000
    min_format_score: 0
    quality_sort: top
    qualities: &qualities_480p
      - &bluray_480p
        name: Bluray-480p
      - &web_480p
        name: WEB 480p
        qualities:
          - WEBDL-480p
          - WEBRip-480p

  - name: SD - 480p Anime
    score_set: anime-sonarr
    reset_unmatched_scores: *reset_scores
    upgrade:
      allowed: true
      until_quality: Bluray-480p
      until_score: 10000
    min_format_score: 100
    quality_sort: top
    qualities: *qualities_480p

  - name: SD - 480p Anime (Dub)
    score_set: anime-sonarr
    reset_unmatched_scores: *reset_scores
    upgrade:
      allowed: true
      until_quality: Bluray-480p
      until_score: 40000
    min_format_score: 20000
    quality_sort: top
    qualities: *qualities_480p

