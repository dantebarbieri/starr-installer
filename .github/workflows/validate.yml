name: Starr installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify pinned public profiles and run fast tests
        run: |
          node --version
          python scripts/starr/profiles.py verify
          STARR_REQUIRE_NODE=1 STARR_NODE="$(command -v node)" \
            python -B -m unittest discover -s scripts/starr/tests -v

  docker:
    name: Full Docker integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_PARALLEL_LIMIT: "2"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reclaim space for fresh optional media images
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h /
          docker version
          docker compose version
          node --version
      - name: Run all tests against disposable local Docker, including optional apps
        run: |
          sudo env DOCKER_CONFIG="$HOME/.docker" COMPOSE_PARALLEL_LIMIT="$COMPOSE_PARALLEL_LIMIT" \
            STARR_DOCKER_TESTS=1 STARR_DOCKER_OPTIONAL=1 STARR_REQUIRE_NODE=1 \
            STARR_NODE="$(command -v node)" \
            "$(command -v python)" -B -m unittest discover -s scripts/starr/tests -v
      - name: Docker diagnostics
        if: failure()
        run: |
          df -h /
          docker system df
          docker ps -a

  publish:
    name: Publish hosting image
    needs: [fast, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate version tag belongs to main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/dantebarbieri/starr-installer
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record published digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "Published ghcr.io/dantebarbieri/starr-installer@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish version release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Create versioned download bundle and checksums
        run: |
          mkdir release
          PYTHONPATH=scripts/starr python - <<'PY'
          import hashlib
          from pathlib import Path
          from serve import Releases
          release = Releases(".", "https://starr.danteb.com").current()
          files = {"bundle.tar.gz": release["bundle"],
                   "provenance.json": Path("recyclarr-configs/provenance.json").read_bytes()}
          for name, data in files.items():
              Path("release", name).write_bytes(data)
          Path("release/SHA256SUMS").write_text("".join(
              f"{hashlib.sha256(data).hexdigest()}  {name}\n" for name, data in files.items()))
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" release/* --verify-tag --generate-notes --title "$VERSION"
